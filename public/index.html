<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Video Viral</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>🔥 Video Viral Hari Ini</h2>

<div class="gallery">

  <div class="thumb" onclick="openInfo()">
    <img src="gambar/1.jpg">
    <p>Video Panas 1</p>
  </div>

  <div class="thumb" onclick="openInfo()">
    <img src="gambar/2.jpg">
    <p>Video Viral 2</p>
  </div>

  <div class="thumb" onclick="openInfo()">
    <img src="gambar/3.jpg">
    <p>Konten Eksklusif 3</p>
  </div>

  <div class="thumb" onclick="openInfo()">
    <img src="gambar/4.jpg">
    <p>Video Trending 4</p>
  </div>

  <div class="thumb" onclick="openInfo()">
    <img src="gambar/5.jpg">
    <p>Video Rahasia 5</p>
  </div>

</div>

<!-- STEP 1 -->
<div id="infoBox" class="popup hidden">
  <div class="box">
    <h3>Untuk menonton video harus melakukan pembayaran sebesar</h3>
    <h2>Rp 5.000</h2>
    <button onclick="lanjutBayar()">Lanjutkan Bayar</button>
  </div>
</div>

<!-- STEP 2 -->
<div id="qrisBox" class="popup hidden">
  <div class="box">
    <h3>Scan QRIS</h3>
    <img src="gambar/qris.jpg">
    <p id="nominal"></p>
    <button onclick="konfirmasi()">Sudah Bayar</button>
  </div>
</div>

<!-- STEP 3 -->
<div id="confirmBox" class="popup hidden">
  <div class="box">
    <h3>Masukkan nominal yang kamu bayar</h3>
    <input type="number" id="inputNominal" placeholder="contoh: 5231">
    <button onclick="cekBayar()">Konfirmasi</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
