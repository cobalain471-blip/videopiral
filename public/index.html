<!DOCTYPE html>
<html>
<head>
  <title>Video Viral 🔥</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🔥 Video Viral Premium</h1>

<div class="grid">
  <div class="card" onclick="openPopup()">
    <img src="https://picsum.photos/300/200?1">
    <div class="title">Cewek cantik viral 😍</div>
  </div>

  <div class="card" onclick="openPopup()">
    <img src="https://picsum.photos/300/200?2">
    <div class="title">Skandal terbaru 😱</div>
  </div>

  <div class="card" onclick="openPopup()">
    <img src="https://picsum.photos/300/200?3">
    <div class="title">Video rahasia bocor 🔥</div>
  </div>

  <div class="card" onclick="openPopup()">
    <img src="https://picsum.photos/300/200?4">
    <div class="title">Yang lagi trending 🚀</div>
  </div>
</div>

<!-- POPUP -->
<div class="popup" id="popup" onclick="closePopup(event)">
  <div class="popup-content">

    <h3>Untuk menonton video</h3>
    <p>Silakan bayar Rp 5.000</p>

    <img src="qris.png" style="width:100%; margin-top:10px">

    <button onclick="lanjutBayar()">Lanjutkan Bayar</button>

    <input type="number" id="nominal" placeholder="Masukkan nominal yang dibayar">

    <button onclick="konfirmasiBayar()">Saya Sudah Bayar</button>

    <p id="error" style="color:red; font-size:12px;"></p>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
