<!DOCTYPE html>
<html>
<head>
  <title>Video</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .card {
      width: 200px;
      margin: 100px auto;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.9);
    }

    .box {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: red;
      color: white;
      border: none;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h2>Klik Video</h2>

<div class="card" onclick="openPopup()">
  <img src="https://picsum.photos/300/400">
</div>

<div class="popup" id="popup" onclick="closePopup(event)">
  <div class="box">

    <!-- STEP 1 -->
    <div id="step1">
      <h3>Bayar Rp 5.000</h3>
      <button onclick="stepBayar()">Lanjutkan Bayar</button>
    </div>

    <!-- STEP 2 -->
    <div id="step2" style="display:none;">
      <h3>Scan QR</h3>
      <p id="total"></p>
      <p>Kode: <span id="kode"></span></p>
      <button onclick="step3()">Saya Sudah Bayar</button>
    </div>

    <!-- STEP 3 -->
    <div id="step3" style="display:none;">
      <input id="nominal" placeholder="Masukkan nominal">
      <button onclick="cek()">Konfirmasi</button>
      <p id="err" style="color:red;"></p>
    </div>

  </div>
</div>

<script>
let total = 0;

function openPopup() {
  document.getElementById("popup").style.display = "flex";
}

function closePopup(e) {
  if (e.target.id === "popup") {
    document.getElementById("popup").style.display = "none";
  }
}

async function stepBayar() {
  try {
    const res = await fetch("/api/qris");
    const data = await res.json();

    total = data.nominal;

    document.getElementById("total").innerText = "Total: Rp " + total;
    document.getElementById("kode").innerText = data.kode;

    document.getElementById("step1").style.display = "none";
    document.getElementById("step2").style.display = "block";

  } catch {
    alert("Server error");
  }
}

function step3() {
  document.getElementById("step2").style.display = "none";
  document.getElementById("step3").style.display = "block";
}

async function cek() {
  const nominal = document.getElementById("nominal").value;

  const res = await fetch("/api/validate", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ nominal })
  });

  const data = await res.json();

  if (!data.success) {
    document.getElementById("err").innerText = "Nominal salah!";
    return;
  }

  window.location.href = data.redirect;
}
</script>

</body>
</html>
