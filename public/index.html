<!DOCTYPE html>
<html>
<head>
  <title>Latest Videos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">Latest Videos</div>

<div class="grid">

  <div class="card" onclick="openPopup()">
    <div class="thumb">
      <img src="https://picsum.photos/300/400?1">
      <div class="view">👁 1K</div>
      <div class="duration">02:59</div>
    </div>
    <div class="like-bar">👍 66%</div>
    <div class="title">Video Viral Panas Terbaru</div>
  </div>

  <div class="card" onclick="openPopup()">
    <div class="thumb">
      <img src="https://picsum.photos/300/400?2">
      <div class="view">👁 371</div>
      <div class="duration">01:00</div>
    </div>
    <div class="like-bar">👍 0%</div>
    <div class="title">Konten Eksklusif Terbongkar</div>
  </div>

</div>

<!-- POPUP -->
<div class="popup" id="popup" onclick="closePopup(event)">
  <div class="popup-box">

    <!-- STEP 1 -->
    <div id="step1">
      <h3>Untuk menonton video</h3>
      <p>Bayar Rp 5.000</p>
      <button id="btnBayar" onclick="stepBayar()">Lanjutkan Bayar</button>
    </div>

    <!-- STEP 2 -->
    <div id="step2" style="display:none;">
      <h3>Scan QRIS</h3>
      <img src="qris.png" style="width:100%">
      <h2 id="totalBayar">Rp 0</h2>
      <p>Kode unik: <span id="kodeUnik"></span></p>
      <button onclick="stepKonfirmasi()">Saya Sudah Bayar</button>
    </div>

    <!-- STEP 3 -->
    <div id="step3" style="display:none;">
      <h3>Konfirmasi Pembayaran</h3>
      <input type="number" id="nominal" placeholder="Masukkan nominal">
      <button onclick="konfirmasiBayar()">Kirim</button>
      <p id="error" style="color:red;"></p>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
