<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      padding: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      background: red;
      border: none;
      color: white;
      width: 100%;
    }
  </style>
</head>
<body>

<h1>⚙️ Admin Panel</h1>

<h3>🔗 Link Redirect</h3>
<input type="text" id="link" placeholder="https://...">
<button onclick="save()">Simpan Link</button>

<script>
async function load() {
  const res = await fetch("/api/redirect");
  const data = await res.json();

  document.getElementById("link").value = data.link;
}

async function save() {
  const link = document.getElementById("link").value;

  await fetch("/api/redirect", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ link })
  });

  alert("Link berhasil disimpan!");
}

load();
</script>

</body>
</html>
